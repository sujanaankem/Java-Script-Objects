<!DOCTYPE html>
<html>

<head>
    <title>Nested Objects</title>
    <script src="NestedObjects.js"></script>
    <link rel="stylesheet" href="NestedObjects.css">
</head>

<body>
    <label>FootWare Name</label>
    <input id="txtFootWareName" type="text">
    <label>FootWare color</label>
    <input id="txtFootWareColor" type="text">
    <label>FootWare type</label>
    <input id="txtFootWareType" type="text">
    <label>FootWare price</label>
    <input id="txtFootWarePrice" type="text">
    <button id="btnCreateFootWare" onclick="onClickCreate()">Create </button>

    <label for="lblfootWareSize">footWare Size</label>
    <input id="txtfootWareSize">
    <button id="btnAdd" onclick="onClickAdd()">Add</button>
    <p id="pResult"></p>
    <p id="pResultAdd"></p>


    <label>Property / Keys</label>
    <input id="txtProperty" type="text">
    <button onclick="onClickReadProperty()">Read</button>
    <p id="pResultProperty"></p>

    <button onclick="onClickReadKeys()">Read Keys</button>
    <button onclick="onClickObjectKeys()">Object Keys</button>
    <p id="pKeysResult"></p>

    <button onclick="onClickObjectValues()">Values Array</button>
    <p id="pValuesResult"></p>


</body>

</html>
